site_name: MMCommander
site_description: A keyboard-driven two-panel file manager for Windows, macOS and Linux.
site_url: https://mmpyro.github.io/MMCommander/
repo_url: https://github.com/mmpyro/MMCommander
repo_name: mmpyro/MMCommander
edit_uri: edit/master/docs/
copyright: MIT licensed

docs_dir: docs
# Pages stay as features/copy.html, so raw <video src="../images/…"> works on the site and on github.com.
use_directory_urls: false
# design/ holds canvas exports that do not render on their own; the rest are tools, not pages.
exclude_docs: |
  design/
  overrides/
  make-screenshots.sh
  requirements.txt

nav:
  - Home: index.md
  - Install: install.md
  - Getting started: getting-started.md
  - Keyboard shortcuts: shortcuts.md
  - Features:
      - Panels and tabs: features/panels.md
      - Copy, move and delete: features/copy.md
      - Search: features/search.md
      - Filter language: features/filter.md
      - Compare: features/compare.md
      - Archives: features/archives.md
      - Thumbnails: features/thumbnails.md
      - Command palette: features/palette.md
      - Settings and themes: features/settings.md
  - Plugins: PLUGINS.md
  - Architecture: ARCHITECTURE.md
  - Changelog: changelog.md

theme:
  name: material
  custom_dir: docs/overrides
  icon:
    logo: material/folder-multiple-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # GitHub-style anchors, so `#…` links work on github.com and on the site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
