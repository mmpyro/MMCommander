<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · F8 Delete confirmation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1014}
a{color:#8AB8FF}a:hover{color:#B5D1FF}
</style>
</helmet>
<div style="position: relative; height: 900px; background: #0E1014; color: #E6E8EB; font-family: Inter, system-ui, sans-serif; font-size: 13px; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; gap: 8px; padding: 96px 8px 84px; opacity: 0.35">
    <div style="flex: 1; border: 1px solid #5B9DFF; border-radius: 10px; background: #14171C"></div>
    <div style="flex: 1; border: 1px solid #232831; border-radius: 10px; background: #14171C"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(5, 6, 8, 0.55)"></div>

  <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px">
    <div role="alertdialog" aria-label="Delete 3 items" style="width: 100%; max-width: 520px; display: flex; flex-direction: column; background: #171A20; border: 1px solid {{dialogBorder}}; border-radius: 14px; box-shadow: 0 28px 80px rgba(0,0,0,0.6)">
      <div style="display: flex; gap: 14px; padding: 20px 20px 8px">
        <div style="flex: 0 0 38px; height: 38px; border-radius: 10px; background: #2A1719; color: #FF9B8A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 17px; font-weight: 600">{{title}}</span>
          <span style="color: #9AA2AE; font-size: 12px">From /Users/mmarszalek · 4.1 MB</span>
        </div>
      </div>

      <div style="margin: 12px 20px 0; border: 1px solid #232831; border-radius: 10px; background: #12151A; overflow: hidden">
        <sc-for list="{{items}}" as="f" hint-placeholder-count="3">
          <div style="display: grid; grid-template-columns: 22px minmax(0, 1fr) 64px; gap: 10px; align-items: center; height: 34px; padding: 0 12px; border-bottom: 1px solid #1E222A">
            <span style="display: flex; color: #C9A2F2"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg></span>
            <span>{{f.name}}</span>
            <span style="text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #C4C9D1">{{f.size}}</span>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 20px 4px">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 3px; border: 1px solid #2A303A; border-radius: 9px; background: #0F1216">
          <button onClick="{{toTrash}}" style="height: 32px; border: 0; border-radius: 6px; background: {{trashBg}}; color: {{trashFg}}; font: inherit; font-weight: 500">Move to Trash</button>
          <button onClick="{{toPermanent}}" style="height: 32px; border: 0; border-radius: 6px; background: {{permBg}}; color: {{permFg}}; font: inherit; font-weight: 500">Delete permanently</button>
        </div>
        <sc-if value="{{isTrash}}" hint-placeholder-val="{{true}}">
          <span style="color: #9AA2AE; font-size: 12px">You can restore these from the Trash. Hold <span style="font-family: 'JetBrains Mono', monospace; color: #C4C9D1">Shift+F8</span> to skip the Trash.</span>
        </sc-if>
        <sc-if value="{{isPermanent}}" hint-placeholder-val="{{false}}">
          <span style="display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: #22161A; color: #FFB3A6; font-size: 12px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
            These files will be removed immediately and can’t be recovered.
          </span>
        </sc-if>
      </div>

      <sc-if value="{{isTrash}}" hint-placeholder-val="{{true}}">
        <label style="display: flex; align-items: center; gap: 10px; padding: 10px 20px 0"><input type="checkbox" style="width: 16px; height: 16px; accent-color: #5B9DFF">Don’t ask again when moving to Trash</label>
      </sc-if>

      <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 16px; padding: 14px 20px; border-top: 1px solid #232831">
        <button style="height: 36px; padding: 0 14px; border: 1px solid #2A303A; border-radius: 8px; background: transparent; color: #E6E8EB; font: inherit">Cancel <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA2AE">Esc</span></button>
        <button style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: #FF8A78; color: #2A0B07; font: inherit; font-weight: 600">{{confirm}} <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7">↵</span></button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'trash' };
  }
  renderVals() {
    const s = this.state || { mode: 'trash' };
    const trash = s.mode === 'trash';
    return {
      isTrash: trash,
      isPermanent: !trash,
      title: trash ? 'Move 3 items to Trash?' : 'Permanently delete 3 items?',
      confirm: trash ? 'Move to Trash' : 'Delete permanently',
      dialogBorder: trash ? '#2A303A' : '#5A2F2B',
      trashBg: trash ? '#262B34' : 'transparent', trashFg: trash ? '#E6E8EB' : '#9AA2AE',
      permBg: trash ? 'transparent' : '#3A1E1E', permFg: trash ? '#9AA2AE' : '#FFB3A6',
      toTrash: () => this.setState({ mode: 'trash' }),
      toPermanent: () => this.setState({ mode: 'permanent' }),
      items: [
        { name: 'image_1.png', size: '1.1 MB' },
        { name: 'image_2.png', size: '1.5 MB' },
        { name: 'image.png', size: '1.5 MB' }
      ]
    };
  }
}
</script>
</body>
</html>
