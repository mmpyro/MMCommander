<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Compare directories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1014}
a{color:#8AB8FF}a:hover{color:#B5D1FF}
</style>
</helmet>
<div style="height: 900px; display: flex; flex-direction: column; background: #0E1014; color: #E6E8EB; font-family: Inter, system-ui, sans-serif; font-size: 13px; overflow: hidden">

  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-bottom: 1px solid #1E222A">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B9DFF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v18M16 3v18M3 8h5M16 16h5"></path></svg>
    <span style="font-size: 15px; font-weight: 600">Compare directories</span>
    <div style="flex: 1 1 20px"></div>
    <label style="display: flex; align-items: center; gap: 8px; color: #C4C9D1">Compare by
      <select style="height: 32px; padding: 0 10px; border: 1px solid #2A303A; border-radius: 8px; background: #14171C; color: #E6E8EB; font: inherit"><option>Name, size and date</option><option>Content (byte by byte)</option><option>Name only</option></select>
    </label>
    <label style="display: flex; align-items: center; gap: 8px; min-height: 32px"><input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #5B9DFF">Include subfolders</label>
    <button style="height: 32px; padding: 0 12px; border: 1px solid #2A303A; border-radius: 8px; background: #1A1E25; color: #E6E8EB; font: inherit">Rescan</button>
  </div>

  <!-- Filter chips -->
  <div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
      <button onClick="{{c.pick}}" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border: 1px solid {{c.border}}; border-radius: 15px; background: {{c.bg}}; color: #E6E8EB; font: inherit; font-size: 12px">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: {{c.dot}}"></span>{{c.label}}<span style="font-family: 'JetBrains Mono', monospace; color: #9AA2AE">{{c.count}}</span>
      </button>
    </sc-for>
  </div>

  <!-- Compare grid -->
  <div style="flex: 1; min-height: 0; margin: 0 8px; border: 1px solid #232831; border-radius: 10px; background: #14171C; overflow: auto">
    <div style="min-width: 900px">
      <div style="position: sticky; top: 0; display: grid; grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr); background: #101318; border-bottom: 1px solid #232831">
        <div style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px"><span style="color: #9AA2AE">Left</span>/Users/mmarszalek</div>
        <div></div>
        <div style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px"><span style="color: #9AA2AE">Right</span>/Users/Shared</div>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr); align-items: center; height: 32px; border-bottom: 1px solid #1A1E25; background: {{r.rowBg}}">
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) 70px 130px; gap: 10px; padding: 0 14px; color: {{r.lfg}}">
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.l}}</span>
            <span style="text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px">{{r.ls}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA2AE">{{r.ld}}</span>
          </div>
          <div style="display: flex; justify-content: center">
            <span aria-label="{{r.statusLabel}}" style="min-width: 28px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: {{r.sBg}}; color: {{r.sFg}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500">{{r.sym}}</span>
          </div>
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) 70px 130px; gap: 10px; padding: 0 14px; color: {{r.rfg}}">
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.r}}</span>
            <span style="text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px">{{r.rs}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA2AE">{{r.rd}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Legend + actions -->
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 12px 16px">
    <span style="display: flex; align-items: center; gap: 6px; color: #9AA2AE; font-size: 12px"><span style="font-family: 'JetBrains Mono', monospace; color: #8AB8FF">→</span>copy to right</span>
    <span style="display: flex; align-items: center; gap: 6px; color: #9AA2AE; font-size: 12px"><span style="font-family: 'JetBrains Mono', monospace; color: #F5B871">←</span>copy to left</span>
    <span style="display: flex; align-items: center; gap: 6px; color: #9AA2AE; font-size: 12px"><span style="font-family: 'JetBrains Mono', monospace; color: #E6E8EB">≠</span>same date, different content</span>
    <span style="display: flex; align-items: center; gap: 6px; color: #9AA2AE; font-size: 12px"><span style="font-family: 'JetBrains Mono', monospace">=</span>identical</span>
    <div style="flex: 1"></div>
    <span style="color: #9AA2AE; font-size: 12px">Plan: 5 → right · 2 ← left · 1 to review</span>
    <button style="height: 36px; padding: 0 14px; border: 1px solid #2A303A; border-radius: 8px; background: transparent; color: #E6E8EB; font: inherit">Close</button>
    <button style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: #5B9DFF; color: #08111F; font: inherit; font-weight: 600">Synchronize…</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const s = this.state || { filter: 'all' };
    const all = [
      ['notes', '—', '2024-09-04 11:31', 'notes', '—', '2026-03-02 09:10', 'left'],
      ['scripts', '—', '2024-09-06 13:54', '', '', '', 'onlyL'],
      ['tmp', '—', '2024-09-24 09:11', '', '', '', 'onlyL'],
      ['appstore_dump.sql', '22 KB', '2024-11-22 13:22', '', '', '', 'onlyL'],
      ['canopy_v1.2.0_darwin_arm64.tar.gz', '3.0 MB', '2026-10-20 16:57', 'canopy_v1.2.0_darwin_arm64.tar.gz', '3.0 MB', '2026-11-10 13:41', 'same'],
      ['cert-manager.yaml', '0 KB', '2026-01-02 08:29', '', '', '', 'onlyL'],
      ['hydrogentorch_logs.txt', '8 KB', '2026-07-08 12:49', 'hydrogentorch_logs.txt', '6 KB', '2026-07-08 12:49', 'diff'],
      ['image_1.png', '1.1 MB', '2024-11-27 15:45', 'image_1.png', '1.1 MB', '2024-11-27 15:45', 'same'],
      ['image_2.png', '1.5 MB', '2024-11-27 15:49', 'image_2.png', '1.5 MB', '2024-11-27 15:49', 'same'],
      ['image.png', '1.5 MB', '2024-11-27 15:37', 'image.png', '1.5 MB', '2024-11-27 15:37', 'same'],
      ['', '', '', '[file only in Shared]', '[size]', '[date]', 'onlyR'],
      ['package.json', '[size]', '[date]', '', '', '', 'onlyL']
    ];
    const kind = {
      left: { sym: '←', label: 'Newer on right', sBg: '#3A2A16', sFg: '#F5B871', cat: 'diff' },
      onlyL: { sym: '→', label: 'Only on left', sBg: '#16263F', sFg: '#8AB8FF', cat: 'left' },
      onlyR: { sym: '←', label: 'Only on right', sBg: '#3A2A16', sFg: '#F5B871', cat: 'right' },
      same: { sym: '=', label: 'Identical', sBg: 'transparent', sFg: '#9AA2AE', cat: 'same' },
      diff: { sym: '≠', label: 'Different content', sBg: '#2A2E36', sFg: '#E6E8EB', cat: 'diff' }
    };
    const count = (c) => all.filter((r) => kind[r[6]].cat === c).length;
    const chipDefs = [
      ['all', 'All', all.length, '#9AA2AE'],
      ['diff', 'Different', count('diff'), '#E6E8EB'],
      ['left', 'Only left', count('left'), '#5B9DFF'],
      ['right', 'Only right', count('right'), '#F0A04B'],
      ['same', 'Identical', count('same'), '#4A515C']
    ];
    const rows = all
      .filter((r) => s.filter === 'all' || kind[r[6]].cat === s.filter)
      .map((r) => {
        const k = kind[r[6]];
        const dim = r[6] === 'same';
        return {
          l: r[0], ls: r[1], ld: r[2], r: r[3], rs: r[4], rd: r[5],
          sym: k.sym, statusLabel: k.label, sBg: k.sBg, sFg: k.sFg,
          lfg: dim ? '#9AA2AE' : '#E6E8EB', rfg: dim ? '#9AA2AE' : '#E6E8EB',
          rowBg: r[6] === 'onlyL' ? '#5B9DFF0D' : (r[6] === 'onlyR' ? '#F0A04B0F' : 'transparent')
        };
      });
    return {
      rows,
      chips: chipDefs.map(([id, label, n, dot]) => ({
        label, count: String(n), dot,
        bg: s.filter === id ? '#232831' : 'transparent',
        border: s.filter === id ? '#3A414D' : '#262B34',
        pick: () => this.setState({ filter: id })
      }))
    };
  }
}
</script>
</body>
</html>
