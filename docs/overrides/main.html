{% extends "base.html" %}
{# Link previews (Slack, GitHub, social): title, description and the main screenshot. #}
{% block extrahead %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page and page.title and not page.is_homepage %}{{ page.title }} - {% endif %}{{ config.site_name }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="{{ config.site_url }}images/main.png">
  <meta name="twitter:card" content="summary_large_image">
{% endblock %}
